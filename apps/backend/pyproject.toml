[project]
name = "frugal-living-backend"
version = "0.1.0"
description = "Frugal Living API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "anthropic>=0.42",
  "httpx>=0.28",
  "python-multipart>=0.0.12",
  "passlib[bcrypt]>=1.7",
  "python-jose[cryptography]>=3.3",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008: FastAPI's `Depends()` is the recommended pattern, not a bug
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/services/llm.py" = ["E501"]  # multi-line LLM prompt strings
"app/services/ingredients.py" = ["E501"]  # multi-line ingredient catalog rows
"app/models/*" = ["E501"]  # SQLAlchemy mapped_column lines are verbose
