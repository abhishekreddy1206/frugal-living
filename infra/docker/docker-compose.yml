services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: frugal
      POSTGRES_PASSWORD: frugal_dev
      POSTGRES_DB: frugal_living
    ports:
      - "5432:5432"
    volumes:
      - ../../postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frugal -d frugal_living"]
      interval: 5s
      timeout: 5s
      retries: 5
